name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py312.txt

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --constraint requirements/constraints-py312.txt --editable ".[dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

  package:
    name: Build and test sdist/wheel
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py312.txt

      - name: Build source and wheel distributions
        run: |
          python -m pip install \
            "pip==26.2.1" \
            "build==1.5.0" \
            "packaging==26.3" \
            "pyproject-hooks==1.2.0" \
            "setuptools==84.0.0" \
            "wheel==0.48.0"
          python -m build --no-isolation

      - name: Inspect distribution contents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          distributions = [*Path("dist").glob("*.whl"), *Path("dist").glob("*.tar.gz")]
          if len(distributions) != 2:
              raise SystemExit(f"Expected one wheel and one sdist, found: {distributions}")

          def unsafe(member: str) -> bool:
              path = PurePosixPath(member.replace("\\", "/"))
              parts = path.parts
              lowered = tuple(part.lower() for part in parts)
              return (
                  any(part == ".env" or part.startswith(".env.") for part in lowered)
                  or "artifacts" in lowered
                  or "__pycache__" in lowered
                  or any(
                      lowered[index : index + 2] in {("data", "raw"), ("data", "processed")}
                      for index in range(max(len(lowered) - 1, 0))
                  )
                  or path.suffix.lower() in {".csv", ".joblib", ".pickle", ".pkl", ".zip"}
              )

          for distribution in distributions:
              if distribution.suffix == ".whl":
                  with zipfile.ZipFile(distribution) as archive:
                      names = archive.namelist()
              else:
                  with tarfile.open(distribution, mode="r:gz") as archive:
                      names = archive.getnames()
              rejected = [name for name in names if unsafe(name)]
              if rejected:
                  raise SystemExit(f"Unsafe files in {distribution}: {rejected}")
              print(f"Verified {distribution}: {len(names)} entries")
          PY

      - name: Test installed wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(realpath dist/*.whl)"
          sdist_path="$(realpath dist/*.tar.gz)"
          constraints_path="$(realpath requirements/constraints-py312.txt)"

          for kind in wheel sdist; do
            if [[ "$kind" == "wheel" ]]; then
              artifact="$wheel_path"
            else
              artifact="$sdist_path"
            fi
            environment="$(mktemp -d)/venv"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install \
              "pip==26.2.1" \
              "setuptools==84.0.0" \
              "wheel==0.48.0"
            "$environment/bin/python" -m pip install \
              --no-build-isolation \
              --constraint "$constraints_path" \
              "$artifact" \
              "httpx2==2.10.0" \
              "pytest==9.1.1"
            "$environment/bin/python" -m pip check
            "$environment/bin/python" -m pytest
          done

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  container:
    name: Build and smoke-test container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --progress=plain --tag machine-failure-risk-classifier:ci .

      - name: Scan runtime image for actionable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: machine-failure-risk-classifier:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify runtime image
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run \
            --detach \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:8000:8000 \
            machine-failure-risk-classifier:ci)"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for _ in {1..30}; do
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$health" == "unhealthy" ]]; then
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect --format='{{.State.Health.Status}}' "$container_id")" = "healthy"
          test "$(docker exec "$container_id" id -u)" = "10001"
          docker exec "$container_id" test ! -e /app/data
          docker exec "$container_id" sh -c \
            "! find /app -type f \( -name 'train.csv' -o -name 'holdout.csv' -o -name 'ai4i2020.csv' \) -print -quit | grep -q ."
          curl --fail --silent --show-error http://127.0.0.1:8000/health

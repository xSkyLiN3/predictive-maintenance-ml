[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-failure-risk-classifier"
version = "1.0.1"
description = "Reproducible educational ML system for AI4I 2020 machine-failure risk."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cristóbal Vergara", email = "cvarvergara@gmail.com" }]
keywords = [
    "machine-learning",
    "predictive-maintenance",
    "fastapi",
    "scikit-learn",
    "ml-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
machine-failure-data = "predictive_maintenance.cli:main"
machine-failure-app = "predictive_maintenance.api:run"

[project.urls]
Homepage = "https://ml.nightstrike.cloud"
Repository = "https://github.com/xSkyLiN3/predictive-maintenance-ml"
Issues = "https://github.com/xSkyLiN3/predictive-maintenance-ml/issues"

[project.optional-dependencies]
dev = [
    "build>=1.5,<2",
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.package-data]
predictive_maintenance = ["web/*.css", "web/*.html", "web/*.js", "web/*.svg"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning:joblib.numpy_pickle",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
